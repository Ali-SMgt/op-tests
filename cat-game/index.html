<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Get The Cat Food</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="game-container">
    <!-- Background layer with 30% opacity -->
    <div id="bg-layer" aria-hidden="true"></div>

    <!-- UI Overlay: Top-left coupon counter (hidden until 30 food collected / 1 coupon) -->
    <header id="ui-header">
      <div id="coupon-box" class="ui-box top-left" style="display: none;">
        <div class="coupon-row">
          <div class="coupon-img-wrap">
            <span class="img-fallback">coupon</span>
            <img
              src="assets/images/coupon.jpg"
              alt="coupon"
              draggable="false"
              onload="this.classList.add('loaded')"
              onerror="this.classList.add('missing')"
            >
          </div>
          <div class="coupon-text">
            <span class="box-label">coupons available : </span>
            <span id="coupon-count" class="box-value">0</span>
          </div>
        </div>
      </div>

      <!-- UI Overlay: Top-right food counter and treat countdown -->
      <div id="food-box" class="ui-box top-right">
        <div class="food-counter-row">
          <span class="box-label">food collected : </span>
          <span id="food-count" class="box-value">0</span>
        </div>
        <div id="treat-countdown" class="treat-countdown" style="display: none;">
          25 treats to coupon
        </div>
      </div>
    </header>

    <!-- Center informational banner: Title & Subtitle -->
    <div id="center-banner" class="center-banner">
      <h1 class="game-title">get the cat food</h1>
      <p class="game-subtitle">move the cat to get the circles for food</p>
    </div>

    <!-- Playable Game Area -->
    <main id="play-area" role="region" aria-label="Playable Game Area">
      <!-- Cat Character -->
      <div id="cat" class="cat-character" aria-label="Cat">≽^•⩊•^≼</div>

      <!-- Dynamic Food Circles Container -->
      <div id="food-container"></div>
    </main>

    <!-- Initial Modal Screen: "do you trust me?" -->
    <div id="trust-modal" class="modal-overlay">
      <div class="modal-card">
        <h2 id="trust-question" class="modal-title">do you trust me?</h2>
        <div id="trust-actions" class="modal-buttons">
          <button id="btn-yes" class="btn btn-trust btn-pink">yes</button>
          <button id="btn-no" class="btn btn-trust btn-purple">no</button>
        </div>
      </div>
    </div>

    <!-- Final Game Over Modal -->
    <div id="game-over-modal" class="modal-overlay" style="display: none;">
      <div class="modal-card game-over-card">
        <div class="game-over-cat">≽^•⩊•^≼</div>
        <div class="reward-img-wrap">
          <span class="img-fallback">coupon</span>
          <img
            src="assets/images/coupon.jpg"
            alt="coupon reward"
            draggable="false"
            onload="this.classList.add('loaded')"
            onerror="this.classList.add('missing')"
          >
        </div>
        <h2 class="game-over-title">thanks for playing, luv u &lt;3</h2>
      </div>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
